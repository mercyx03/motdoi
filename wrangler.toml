# Triển khai lên Cloudflare Workers (static assets): npm run build && npx wrangler deploy (thư mục dist do tools/build.js tạo)
name = "mot-doi"
compatibility_date = "2025-09-01"
main = "dist/_worker.js"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/market", "/api/reviews", "/api/account", "/api/comments", "/_worker.js"]
